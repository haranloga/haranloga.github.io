name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue deployments instead of cancelling in-flight ones — cancelling a
# Pages deploy mid-run leaves the environment locked and fails the next run
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install blargh
        run: npm install -g @mariozechner/blargh

      - name: Build site
        run: blargh --in src --out html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
