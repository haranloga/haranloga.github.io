<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel='stylesheet' type='text/css' href='/style.css'>

    <title>
        <%= title %>
    </title>
    <meta name="description" content="<%= description %>" />
    <meta property="og:title" content="<%= title %>" />
    <meta property="og:type" content="article" />
    <meta property="og:description" content="<%= description %>" />
    <meta property="og:image"
        content="<%= typeof image !== 'undefined' && image ? image : 'https://haranloga.github.io/img/band.png' %>" />
    <meta property="og:url" content="<%= url %>" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="haranloga.github.io" />
    <meta property="twitter:url" content="<%= url %>" />
    <meta name="twitter:title" content="<%= title %>" />
    <meta name="twitter:description" content="<%= description %>" />
    <meta name="twitter:image"
        content="<%= typeof image !== 'undefined' && image ? image : 'https://haranloga.github.io/img/band.png' %>" />
    <!-- Inline theme init: runs sync before first paint to prevent flash -->
    <script>!function () { var t = localStorage.getItem('theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); localStorage.getItem('theme') || localStorage.setItem('theme', 'dark') }();</script>
    <script src="/components.js" defer></script>
</head>

<body>
    <div class="mx-auto p-6" style="max-width: 640px; width: 100%">
        <div class="flex flex-col pb-4">
            <div class="flex flex-row" style="justify-content:space-between;align-items:center;">
                <a href="/" style="color: var(--text-color); text-decoration: none;">
                    <h2 style="margin:0;">/&gt; Araharan Loganayagam</h2>
                </a>
                <div class="flex gap-2" style="align-items:center;">
                    <a href="/#projects" class="about-shortcut" aria-label="Projects" title="Projects"
                        style="width:18px;height:18px;color: var(--link-color);">
                        <i class="icon" style="width:18px;height:18px;">
                            <%=render("../_icons/projects-line.svg")%>
                        </i>
                    </a>
                    <a href="/posts/2020-11-22-about/" class="about-shortcut" aria-label="About" title="About me"
                        style="width:18px;height:18px;color: var(--link-color);">
                        <i class="icon" style="width:18px;height:18px;">
                            <%=render("../_icons/about-me.svg")%>
                        </i>
                    </a>
                    <theme-toggle style="display:inline-flex;align-items:center;"></theme-toggle>
                </div>
            </div>
            <a href="/" style="color: var(--text-color); text-decoration: none;">
                <span class="text-sm">Product building • AI Safety • Cybersecurity</span>
            </a>
            <div class="flex gap-2 mt-1" style="align-items:center;">
                <a href="https://www.linkedin.com/in/dream4ip/" title="LinkedIn" aria-label="LinkedIn"
                    style="color: var(--link-color);">
                    <i class="icon" style="width: 18px; height: 18px;">
                        <%=render("../_icons/linkedin-line.svg")%>
                    </i>
                </a>
                <a href="https://twitter.com/haran_loga" title="Twitter" aria-label="Twitter"
                    style="color: var(--link-color);">
                    <i class="icon" style="width: 18px; height: 18px;">
                        <%=render("../_icons/twitter-line.svg")%>
                    </i>
                </a>
                <a href="https://github.com/haranloga" title="GitHub" aria-label="GitHub"
                    style="color: var(--link-color);">
                    <i class="icon" style="width: 18px; height: 18px;">
                        <%=render("../_icons/github-line.svg")%>
                    </i>
                </a>
            </div>
        </div>
