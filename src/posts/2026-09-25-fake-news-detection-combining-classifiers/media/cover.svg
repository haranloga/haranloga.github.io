<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover art: three small classifier nodes converging with arrows into a central shield with a checkmark, representing three classifiers voting together to flag a fake account">
<defs>
<linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0a1a45"></stop>
<stop offset="55%" stop-color="#12408f"></stop>
<stop offset="100%" stop-color="#1a6fd1"></stop>
</linearGradient>
<pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40,0 L0,0 0,40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"></path>
</pattern>
</defs>
<rect width="1200" height="630" fill="url(#bgGrad4)"></rect>
<rect width="1200" height="630" fill="url(#grid4)"></rect>
<circle cx="600" cy="300" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"></circle>
<circle cx="600" cy="300" r="205" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="3 7"></circle>

<line x1="430" y1="200" x2="555" y2="270" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"></line>
<line x1="770" y1="200" x2="645" y2="270" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"></line>
<line x1="600" y1="410" x2="600" y2="345" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"></line>

<circle cx="400" cy="180" r="58" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2.5"></circle>
<text x="400" y="176" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Naive</text>
<text x="400" y="195" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Bayes</text>

<circle cx="600" cy="150" r="58" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2.5"></circle>
<text x="600" y="155" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Clustering</text>

<circle cx="800" cy="180" r="58" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2.5"></circle>
<text x="800" y="176" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Decision</text>
<text x="800" y="195" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Trees</text>

<circle cx="600" cy="410" r="72" fill="#6ea8ff"></circle>
<circle cx="600" cy="410" r="72" fill="none" stroke="#ffffff" stroke-width="3"></circle>
<path d="M566,410 L590,436 L636,384" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>

<text x="70" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="30" font-weight="700" fill="#ffffff" fill-opacity="0.92">/&gt;</text>
<text x="600" y="536" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="0.01em">Fake News Detection</text>
<text x="600" y="570" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="19" fill="#ffffff" fill-opacity="0.72" letter-spacing="0.02em">Three classifiers, one vote</text>
</svg>
